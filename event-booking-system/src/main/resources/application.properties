spring.application.name=event-booking-system
server.port=${PORT:5698}

# Local password secret.properties se aayega (GitHub pe nahi jaata)
spring.config.import=optional:classpath:secret.properties

# Database (MySQL) - local pe defaults, live (Render) pe environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventbooking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-of-at-least-32-chars}
app.jwt.expiration-ms=86400000

# CORS (React frontend URLs, comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Mail (false = email console me log hoga)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=no-reply@eventbooking.com

# Booking
app.booking.pending-expiry-minutes=15
